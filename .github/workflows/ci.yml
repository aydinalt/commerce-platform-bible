name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: commerce
          POSTGRES_PASSWORD: commerce
          POSTGRES_USER: commerce
        options: >-
          --health-cmd "pg_isready -U commerce -d commerce"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://commerce:commerce@localhost:5432/commerce
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version-file: .nvmrc

      - run: npm ci
      - run: npm run db:deploy
      - run: npm run verify
      - run: git diff --exit-code -- generated/openapi.json

      # Entry gate: the migrated database must match the datamodel exactly.
      # Without this, a hand-written migration and schema.prisma can diverge
      # silently and the divergence only surfaces on the next `migrate dev`.
      - name: Verify no schema drift
        run: npm run db:drift
