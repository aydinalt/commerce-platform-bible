name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: commerce
          POSTGRES_PASSWORD: commerce
          POSTGRES_USER: commerce
        options: >-
          --health-cmd "pg_isready -U commerce -d commerce"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://commerce:commerce@localhost:5432/commerce
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version-file: .nvmrc

      - run: npm ci
      - run: npm run db:deploy

      # One command, and that is the point.
      #
      # This job used to run three: `verify`, then the OpenAPI diff, then
      # `db:drift`. Two of the three lived only here, so `npm run verify` — the
      # command everyone runs before handing work over — was a strict subset of
      # what CI checks. A green local chain therefore could not predict CI, and
      # twice it did not: #149 and #150 both went red on schema drift after a
      # verification run that had reported clean, because the run could not
      # reach the check that failed.
      #
      # `verify:ci` is now the whole contract, defined once in package.json.
      # `db:drift` moved inside `verify` itself: the migrated database matching
      # the datamodel is an invariant a developer wants to know about
      # immediately, not a release gate. Without it a hand-written migration and
      # schema.prisma diverge silently, and the divergence surfaces on somebody
      # else's next `migrate dev`.
      - run: npm run verify:ci
