name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: commerce
          POSTGRES_PASSWORD: commerce
          POSTGRES_USER: commerce
        options: >-
          --health-cmd "pg_isready -U commerce -d commerce"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://commerce:commerce@localhost:5432/commerce
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version-file: .nvmrc

      - run: npm ci
      - run: npm run db:deploy

      # One command, and that is the point.
      #
      # This job used to run three: `verify`, then the OpenAPI diff, then
      # `db:drift`. Two of the three lived only here, so `npm run verify` — the
      # command everyone runs before handing work over — was a strict subset of
      # what CI checks. A green local chain therefore could not predict CI, and
      # twice it did not: #149 and #150 both went red on schema drift after a
      # verification run that had reported clean, because the run could not
      # reach the check that failed.
      #
      # `verify:ci` is the contract for everything this job checks, defined once
      # in package.json. `db:drift` moved inside `verify` itself: the migrated
      # database matching the datamodel is an invariant a developer wants to
      # know about immediately, not a release gate. Without it a hand-written
      # migration and schema.prisma diverge silently, and the divergence
      # surfaces on somebody else's next `migrate dev`.
      #
      # The dependency audit is the one check that left this chain, and it left
      # it as a separate job below rather than as a lowered threshold. See that
      # job for why.
      #
      # The subset relation the paragraph above is about still holds, in the
      # safe direction: `npm run verify` locally is `verify:core` **plus** the
      # audit, so a green local run still predicts a green job here. What no
      # longer holds is that one command names everything CI runs — CI now runs
      # two, and both are in package.json.
      - run: npm run verify:ci

  # Why the dependency audit is its own job.
  #
  # `npm audit --audit-level=high` is red on transitive dependencies and is
  # expected to stay red until upstream `fastify` and `prisma` releases clear
  # it. The Owner's decision of 2026-09-07 was to keep the gate at `high` and
  # accept the risk rather than lower it to `critical`, because a gate lowered
  # to go green stops being a gate.
  #
  # Keeping it inside `verify:ci` would have honoured that decision and defeated
  # it at the same time. One known-red step makes every other check's result
  # invisible from outside: a genuine test failure and this advisory produce the
  # same single red cross, and a run that is always red is a run nobody reads.
  #
  # **The threshold is unchanged and this job still fails.** What changed is
  # that it fails on its own, where it can be seen, and stops standing in front
  # of the checks it is not about.
  #
  # `V1_SECURITY_REVIEW.md` §2.3 owns the decision and names who has to watch
  # for the upstream releases. When they land, this job goes green and the only
  # question is whether it should move back.
  audit:
    name: Dependency audit (known red — see V1_SECURITY_REVIEW.md §2.3)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version-file: .nvmrc

      - run: npm ci
      - run: npm run security:audit
