name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Both actions are pinned at v5 because that is the first major of each that
# declares `using: node24`. GitHub is removing Node 20 from the runners on
# **23 September 2026** — after that an action still targeting it stops working
# rather than warning — and until then v4 runs under a compatibility force that
# emits a deprecation warning on every job.
#
# v5 rather than the newest major: it is the smallest step that clears the
# deadline, and a version bump taken for a runtime deadline should not also
# carry whatever else changed two majors later.

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: commerce
          POSTGRES_PASSWORD: commerce
          POSTGRES_USER: commerce
        options: >-
          --health-cmd "pg_isready -U commerce -d commerce"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://commerce:commerce@localhost:5432/commerce
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          cache: npm
          node-version-file: .nvmrc

      - run: npm ci
      - run: npm run db:deploy

      # One command, and that is the point.
      #
      # This job used to run three: `verify`, then the OpenAPI diff, then
      # `db:drift`. Two of the three lived only here, so `npm run verify` — the
      # command everyone runs before handing work over — was a strict subset of
      # what CI checks. A green local chain therefore could not predict CI, and
      # twice it did not: #149 and #150 both went red on schema drift after a
      # verification run that had reported clean, because the run could not
      # reach the check that failed.
      #
      # `verify:ci` is the contract for everything this job checks, defined once
      # in package.json. `db:drift` moved inside `verify` itself: the migrated
      # database matching the datamodel is an invariant a developer wants to
      # know about immediately, not a release gate. Without it a hand-written
      # migration and schema.prisma diverge silently, and the divergence
      # surfaces on somebody else's next `migrate dev`.
      #
      # The dependency audit is the one check that left this chain. It left as a
      # workflow of its own — `audit.yml` — rather than as a lowered threshold,
      # and that file carries the reasoning.
      #
      # The subset relation the paragraph above is about still holds, in the
      # safe direction: `npm run verify` locally is `verify:core` **plus** the
      # audit, so a green local run still predicts a green job here. What no
      # longer holds is that one command names everything CI runs — CI runs two,
      # and both are in package.json.
      #
      # **This workflow's colour is now a fact about the code**, and that is the
      # point of the split: a red cross here means something broke, and it can
      # no longer mean "the dependency debt is still outstanding".
      - run: npm run verify:ci
