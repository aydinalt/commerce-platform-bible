r doğru ama günlük kullanımda hissettirdiği kalite fiyatının altında. İade ettim. Yıldızım ürüne, satıcıya değil — satıcı süreçte gayet iyiydi.`,daysAgo:44,helpful:18,rating:2,title:"Bana göre değildi, iade ettim",verified:!0},{author:"Kerem Y.",body:()=>"Üç aydır kullanıyorum, hâlâ ilk günkü gibi. Bu tip ürünlerde asıl mesele ilk hafta değil üçüncü ay; o yüzden yorumu bekleyip yazdım. Fiyatı da o günden bu yana 600 lira düşmüş, alacaklar biraz daha bekleyebilir.",daysAgo:52,helpful:63,rating:5,title:"Üç ay sonra yazıyorum",verified:!1},{author:"Selin B.",body:()=>"Ortalama. Ne çok iyi ne çok kötü. Alternatif ürünler bölümündeki ikinci seçenekle arasında ciddi fark yok, hangisi ucuzsa onu alın.",daysAgo:67,helpful:9,rating:3,title:"Ortalama bir ürün",verified:!1}],X0=e=>new Date(Date.UTC(2026,7,31)-e*864e5).toISOString().slice(0,10);function Cb(e){let a=Math.max(2,Math.min(j0.length,Math.round(e.reviewCount/12)));return j0.slice(0,a).map((t,l)=>({author:t.author,body:t.body(e.name),date:X0(t.daysAgo+l),helpful:t.helpful,id:`${e.id}-r${l}`,rating:t.rating,title:t.title,verified:t.verified}))}function Kb(e){let a=e.specs.find(l=>l.key),t=e.specs.filter(l=>l.key)[1];return{author:"Editör ekibi",cons:["Kutu içeriği satıcıdan satıcıya değişiyor; sipariş öncesi listeyi karşılaştırın","Fiyat bandının üst ucundaki satıcılarla en ucuz arasında kayda değer fark var","Garanti süresi rakiplerinin bir kısmının gerisinde"],pros:[a?`${a.label}: ${a.chips.join(", ")}`:"Sınıfına göre dengeli donanım",t?`${t.label}: ${t.chips.join(", ")}`:"Günlük kullanımda beklenen performans","Aynı fiyat bandındaki alternatiflere göre daha geniş satıcı ağı"],publishedAt:e.listedAt,score:Math.round(e.popularity/10*10)/10,sections:[{body:`${e.name}, ${e.brand} tarafından bu fiyat bandında konumlandırılan bir seçenek. Bu incelemede ürünü kâğıt üzerindeki özellikleriyle değil, aynı bantta yer alan alternatiflerle yan yana koyarak değerlendiriyoruz — çünkü tek başına bir özellik listesi hiçbir satın alm
